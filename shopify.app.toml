# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "c0d80faff1d7b78f825e2fc2decd0af0"
name = "freshness-tracker"
application_url = "https://example.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,read_metaobjects,read_fulfillments"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/fulfillments/create"
  topics = [ "fulfillments/create" ]

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true

[metaobjects.app.freshness_batch]
name = "Freshness Batch"
access.admin = "merchant_read_write"
access.storefront = "none"

[metaobjects.app.freshness_batch.fields.quantity]
name = "Quantity"
type = "number_integer"
required = true

[metaobjects.app.freshness_batch.fields.expiration_date]
name = "Expiration Date"
type = "date"
required = true

[product.metafields.app.freshness_batches]
name = "Freshness Batches"
type = "list.metaobject_reference<$app:freshness_batch>"
access.admin = "merchant_read_write"
access.storefront = "none"

[product.metafields.app.earliest_expiration_date]
name = "Earliest Expiration Date"
type = "date"
access.admin = "merchant_read_write"
access.storefront = "public_read"
